# =========================================================
# Ford VIN Share API — Configurações da Aplicação
# =========================================================

spring.application.name=ford-vinshare-api
server.port=8080

# ---------------------------------------------------------
# Oracle Database
# ---------------------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl
spring.datasource.username=RM555524
spring.datasource.password=2403
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection Pool (UCP)
spring.datasource.oracleucp.min-pool-size=2
spring.datasource.oracleucp.max-pool-size=10
spring.datasource.oracleucp.connection-wait-duration-in-millis=3000

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# Flyway — Controle de Migrações
# ---------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.br.com.ford=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
